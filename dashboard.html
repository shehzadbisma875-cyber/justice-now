<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard - Justice Now</title>
</head>
<body>

  <!-- آپ کا ڈیش بورڈ کا مواد -->
  <div style="text-align: center; padding: 50px;">
    <h1>Welcome to Justice Now Dashboard</h1>
    <p>You are successfully logged in!</p>
    <button id="logoutBtn" style="padding: 10px 20px; cursor: pointer;">Logout</button>
  </div>

  <!-- Firebase Session & Authentication Script -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { 
      getAuth, 
      signOut, 
      onAuthStateChanged 
    } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

    const firebaseConfig = {
      apiKey: "AIzaSyDqR4opYs45_yVoWV28vXmLLWYKbAKkrKw",
      authDomain: "justice-now-406e9.firebaseapp.com",
      projectId: "justice-now-406e9",
      storageBucket: "justice-now-406e9.firebasestorage.app",
      messagingSenderId: "651828513296",
      appId: "1:651828513296:web:41f7491a9e92fddb641895"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);

    // سیشن چیک کریں
    onAuthStateChanged(auth, (user) => {
      if (!user) {
        // اگر سائن ان نہیں ہے تو لاگ ان پیج پر بھیج دیں
        window.location.href = "index.html";
      } else {
        console.log("Logged in user:", user.displayName);
      }
    });

    // لاگ آؤٹ کا کوڈ
    const logoutBtn = document.getElementById("logoutBtn");
    if (logoutBtn) {
      logoutBtn.addEventListener("click", () => {
        signOut(auth).then(() => {
          window.location.href = "index.html";
        });
      });
    }
  </script>
</body>
</html>
