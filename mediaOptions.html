<!-- This is conceptually an overlay -->
<div class="media-overlay">
  <div class="media-icon-container">
    <div class="media-icon camera"><i class="cam-icon"></i>Camera</div>
    <div class="media-icon gallery"><i class="gallery-icon"></i>Gallery</div>
    <div class="media-icon file"><i class="file-icon"></i>File</div>
